<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>US Amateur Radio Technician Flash Cards 2026-2030</title>
<style>
:root {
  color-scheme: light dark;
  --bg:#f3f5f7; --panel:#ffffff; --text:#17202a; --muted:#667085;
  --accent:#1357a6; --good:#176b3a; --bad:#a12c2c; --border:#d8dee6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#101418; --panel:#1a2026; --text:#edf2f7; --muted:#a9b3bf;
           --accent:#79b8ff; --good:#75d49a; --bad:#ff8e8e; --border:#34404c; }
}
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg); color:var(--text); }
header { max-width:920px; margin:auto; padding:18px 16px 8px; }
h1 { font-size:1.35rem; margin:0 0 5px; }
.sub { color:var(--muted); font-size:.92rem; line-height:1.35; }
.controls { max-width:920px; margin:auto; padding:8px 16px 10px; display:grid;
             grid-template-columns:1fr 1fr; gap:8px; }
select, button, input { font:inherit; border:1px solid var(--border); background:var(--panel);
                         color:var(--text); border-radius:10px; padding:10px; }
button { cursor:pointer; }
button.primary { background:var(--accent); color:white; border-color:var(--accent); font-weight:700; }
.stats { grid-column:1/-1; display:flex; justify-content:space-between; color:var(--muted); font-size:.9rem; }
main { max-width:920px; margin:auto; padding:0 16px 22px; }
.card { position:relative; min-height:440px; perspective:1100px; cursor:pointer; }
.inner { position:relative; width:100%; min-height:440px; transition:transform .38s ease;
          transform-style:preserve-3d; }
.card.flipped .inner { transform:rotateY(180deg); }
.face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
         background:var(--panel); border:1px solid var(--border); border-radius:18px;
         padding:20px; box-shadow:0 5px 22px rgba(0,0,0,.08); overflow:auto; }
.back { transform:rotateY(180deg); }
.badge { display:inline-block; border:1px solid var(--border); border-radius:999px;
          padding:4px 9px; color:var(--muted); font-size:.8rem; margin-bottom:12px; }
.question { font-size:1.2rem; font-weight:700; line-height:1.35; margin-bottom:15px; }
.choice { border:1px solid var(--border); border-radius:11px; padding:10px 12px; margin:8px 0;
           line-height:1.35; }
.figure { display:block; max-width:100%; max-height:250px; margin:10px auto 16px; border-radius:8px; }
.answer-title { color:var(--good); font-size:.95rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
.answer { font-size:1.35rem; font-weight:800; line-height:1.35; margin:8px 0 16px; }
.ref { color:var(--muted); font-size:.9rem; }
.hint { color:var(--muted); font-size:.85rem; margin-top:18px; }
.nav { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px; }
.mark { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
.mark .knew { border-color:var(--good); color:var(--good); }
.mark .missed { border-color:var(--bad); color:var(--bad); }
.search { grid-column:1/-1; }
@media (min-width:700px) {
  .controls { grid-template-columns:170px 1fr 140px 140px; }
  .search { grid-column:auto; }
}
</style>
</head>
<body>
<header>
  <h1>US Amateur Radio Technician Flash Cards</h1>
  <div class="sub">2026-2030 FCC Element 2 pool • 409 questions • Effective July 1, 2026-June 30, 2030</div>
</header>

<section class="controls">
  <select id="filter" aria-label="Filter">
    <option value="ALL">All 409 questions</option>
    <option value="T1">T1 - Commission's Rules</option>
    <option value="T2">T2 - Operating Procedures</option>
    <option value="T3">T3 - Radio Wave Propagation</option>
    <option value="T4">T4 - Amateur Radio Practices</option>
    <option value="T5">T5 - Electrical Principles</option>
    <option value="T6">T6 - Components</option>
    <option value="T7">T7 - Practical Circuits</option>
    <option value="T8">T8 - Signals and Emissions</option>
    <option value="T9">T9 - Antennas and Feed Lines</option>
    <option value="T0">T0 - Safety</option>
  </select>
  <input id="search" class="search" placeholder="Search question or ID">
  <button id="shuffle">Shuffle</button>
  <button id="reset">Reset score</button>
  <div class="stats"><span id="counter"></span><span id="score"></span></div>
</section>

<main>
  <div class="card" id="card" title="Tap to reveal answer">
    <div class="inner">
      <section class="face front" id="front"></section>
      <section class="face back" id="back"></section>
    </div>
  </div>
  <div class="nav">
    <button id="prev">Previous</button>
    <button class="primary" id="flip">Reveal</button>
    <button id="next">Next</button>
  </div>
  <div class="mark">
    <button class="knew" id="knew">✓ Knew it</button>
    <button class="missed" id="missed">✗ Missed it</button>
  </div>
</main>

: "A printed copy of the certificate of successful completion of examination", "B": "An email notification from the NCVEC granting the license", "C": "The license appears in the FCC ULS database", "D": "All these choices are correct"}, "figure": "", "subelement": "T1", "group": "T1A", "figure_data": ""}, {"id": "T1A06", "correct_letter": "D", "refs": "[97.203(d)]", "question": "On which of the following HF frequencies can automatically controlled amateur propagation beacons be found?", "answers": {"A": "Anywhere in the Technician portion of 10 meters", "B": "Anywhere, if they are registered with the FCC", "C": "In a specific portion of each of the HF Technician bands", "D": "On ten meters, between 28.200 MHz and 28.300 MHz"}, "figure": "", "subelement": "T1", "group": "T1A", "figure_data": ""}, {"id": "T1A07", "correct_letter": "C", "refs": "[97.3(a)(41)]", "question": "What is the FCC Part 97 definition of a space station?", "answers": {"A": "Any satellite orbiting Earth", "B": "A manned satellite orbiting Earth", "C": "An amateur station located more than 50 km above Earth's surface", "D": "An amateur station using amateur radio satellites for relay of signals"}, "figure": "", "subelement": "T1", "group": "T1A", "figure_data": ""}, {"id": "T1A08", "correct_letter": "B", "refs": "[97.3(a)(22)]", "question": "Who recommends transmit/receive channels for repeater and auxiliary stations?", "answers": {"A": "A Frequency Spectrum Manager appointed by the FCC", "B": "A Volunteer Frequency Coordinator recognized by local amateurs", "C": "An FCC Regional Field Office", "D": "The International Telecommunication Union"}, "figure": "", "subelement": "T1", "group": "T1A", "figure_data": ""}, {"id": "T1A09", "correct_letter": "C", "refs": "[97.3(a)(22)]", "question": "Who selects a Frequency Coordinator?", "answers": {"A": "The FCC Office of Spectrum Management and Coordination Policy", "B": "The local chapter of the Office of National Council of Independent Frequency Coordinators", "C": "Amateur operators in a local or regional area whose stations are eligible to be repeater or auxiliary stations", "D": "The FCC Regional Field Office"}, "figure": "", "subelement": "T1", "group": "T1A", "figure_data": ""}, {"id": "T1A10", "correct_letter": "C", "refs": "[97.407(a)]", "question": "Besides an FCC-issued amateur operator license, what is required to be the control operator of a Radio Amateur Civil Emergency Service (RACES) Station?", "answers": {"A": "A written recommendation by the local ARRL Emergency Coordinator", "B": "Membership in the Amateur Radio Emergency Service (ARES)", "C": "Certification of current enrollment by a civil defense organization", "D": "Nothing"}, "figure": "", "subelement": "T1", "group": "T1A", "figure_data": ""}, {"id": "T1A11", "correct_letter": "B", "refs": "[97.101(d)]", "question": "Which of the following is prohibited?", "answers": {"A": "International communications on VHF bands and higher frequencies", "B": "Willful or malicious interference", "C": "Third-party traffic using digital modes", "D": "All these choices are correct"}, "figure": "", "subelement": "T1", "group": "T1A", "figure_data": ""}, {"id": "T1B01", "correct_letter": "C", "refs": "[97.301(e)]", "question": "Which of the following frequency ranges are available for phone operation by Technician licensees?", "answers": {"A": "28.050 MHz to 28.150 MHz", "B": "28.100 MHz to 28.300 MHz", "C": "28.300 MHz to 28.500 MHz", "D": "28.500 MHz to 28.600 MHz"}, "figure": "", "subelement": "T1", "group": "T1B", "figure_data": ""}, {"id": "T1B02", "correct_letter": "B", "refs": "[97.301, 97.207(c)]", "question": "Which of the following U.S. amateur radio operators are allowed to contact the International Space Station (ISS) on VHF bands?", "answers": {"A": "Only amateurs with a General class or higher license", "B": "Any amateur with a Technician class or higher license", "C": "Only amateurs with a General class or higher license, and NASA approval", "D": "Any amateurs with a Technician class or higher license, and NASA approval"}, "figure": "", "subelement": "T1", "group": "T1B", "figure_data": ""}, {"id": "T1B03", "correct_letter": "B", "refs": "[97.301(a)]", "question": "Which frequency is in the 6-meter amateur band?", "answers": {"A": "49.00 MHz", "B": "52.525 MHz", "C": "28.50 MHz", "D": "222.15 MHz"}, "figure": "", "subelement": "T1", "group": "T1B", "figure_data": ""}, {"id": "T1B04", "correct_letter": "D", "refs": "[97.301(a)]", "question": "Which amateur band includes 146.52 MHz?", "answers": {"A": "6 meters", "B": "20 meters", "C": "70 centimeters", "D": "2 meters"}, "figure": "", "subelement": "T1", "group": "T1B", "figure_data": ""}, {"id": "T1B05", "correct_letter": "D", "refs": "[97.301, 97.305]", "question": "Which of the following bands include frequencies where Technicians are authorized to use digital modes such as FT8?", "answers": {"A": "10 meters", "B": "6 meters", "C": "2 meters", "D": "All these choices are correct"}, "figure": "", "subelement": "T1", "group": "T1B", "figure_data": ""}, {"id": "T1B06", "correct_letter": "B", "refs": "[97.301(e), 97.305]", "question": "On which HF bands does a Technician class operator have phone privileges?", "answers": {"A": "None", "B": "10-meter band only", "C": "80-meter, 40-meter, 15-meter, and 10-meter bands", "D": "30-meter band only"}, "figure": "", "subelement": "T1", "group": "T1B", "figure_data": ""}, {"id": "T1B07", "correct_letter": "A", "refs": "[97.305(a), (c)]", "question": "Which of the following VHF/UHF band segments are limited to CW only?", "answers": {"A": "50.0 MHz to 50.1 MHz and 144.0 MHz to 144.1 MHz", "B": "219 MHz to 220 MHz and 420.0 MHz to 420.1 MHz", "C": "902.0 MHz to 902.1 MHz", "D": "All these choices are correct"}, "figure": "", "subelement": "T1", "group": "T1B", "figure_data": ""}, {"id": "T1B08", "correct_letter": "A", "refs": "[97.303]", "question": "How are US amateurs restricted in segments of bands where the Amateur Radio  "D": "1500 watts"}, "figure": "", "subelement": "T1", "group": "T1B", "figure_data": ""}, {"id": "T1C01", "correct_letter": "D", "refs": "[97.9(a), 97.17(a)]", "question": "For which classes of amateur radio licenses does the FCC currently issue new licenses?", "answers": {"A": "Novice, Technician, General, Amateur Extra", "B": "Technician, Technician Plus, General, Amateur Extra", "C": "Novice, Technician Plus, General, Advanced", "D": "Technician, General, Amateur Extra"}, "figure": "", "subelement": "T1", "group": "T1C", "figure_data": ""}, {"id": "T1C02", "correct_letter": "D", "refs": "[97.19]", "question": "Who may select a desired call sign under the vanity call sign rules?", "answers": {"A": "Only a licensed amateur with a General or Amateur Extra Class license", "B": "Only a licensed amateur with an Amateur Extra Class license", "C": "Only a licensed amateur who has been licensed continuously for more than 10 years", "D": "Any licensed amateur"}, "figure": "", "subelement": "T1", "group": "T1C", "figure_data": ""}, {"id": "T1C03", "correct_letter": "A", "refs": "[97.117]", "question": "What types of international communications are FCC-licensed amateur radio stations permitted to make?", "answers": {"A": "Communications incidental to the purposes of the Amateur Radio Service and remarks of a personal character", "B": "Communications incidental to conducting business or remarks of a personal nature", "C": "Only communications incidental to contest exchanges; all other communications are prohibited", "D": "Any communications that would be permitted by an international broadcast station"}, "figure": "", "subelement": "T1", "group": "T1C", "figure_data": ""}, {"id": "T1C04", "correct_letter": "B", "refs": "[97.23]", "question": "What may happen if the FCC is unable to reach you by email?", "answers": {"A": "Fine and suspension of operator license", "B": "Revocation of the station license or suspension of the operator license", "C": "Revocation of access to the ", "refs": "[97.5a]", "question": "How soon after passing the examination for your first amateur radio license may you transmit on the amateur radio bands?", "answers": {"A": "Immediately on receiving your Certificate of Successful Completion of Examination (CSCE)", "B": "As soon as your operator/station license grant appears on the ARRL website", "C": "As soon as your operator/station license grant appears in the FCC’s license database", "D": "As soon as you receive your license in the mail from the FCC"}, "figure": "", "subelement": "T1", "group": "T1C", "figure_data": ""}, {"id": "T1C11", "correct_letter": "D", "refs": "[97.21(b)]", "question": "If your license has expired and is still within the allowable grace period, may you continue to transmit on the amateur radio bands?", "answers": {"A": "Yes, for up to two years", "B": "Yes, as soon as you apply for renewal", "C": "Yes, for up to one year", "D": "No, you must wait until the license has been renewed"}, "figure": "", "subelement": "T1", "group": "T1C", "figure_data": ""}, {"id": "T1D01", "correct_letter": "A", "refs": "[97.111(a)(1)]", "question": "With which countries are FCC-licensed amateur radio stations prohibited from exchanging communications?", "answers": {"A": "Any country whose administration has notified the International Telecommunication Union (ITU) that it objects to such communications", "B": "Any country whose administration has notified the American Radio Relay League (ARRL) that it objects to such communications", "C": "Any country banned from such communications by the International Amateur Radio Union (IARU)", "D": "Any country banned from making such communications by the American Radio Relay League (ARRL)"}, "figure": "", "subelement": "T1", "group": "T1D", "figure_data": ""}, {"id": "T1D02", "correct_letter": "B", "refs": "[97.113(b), 97.111(b)]", "question": "Under which of the following circumstances are one-way transmissions by an amateur station prohibited?", "answers": {"A": "Announcements of upcoming ham radio operating events", "B": "Broadcasting", "C": "International Morse Code Practice", "D": "Telecommand or transmissions of telemetry"}, "figure": "", "subelement": "T1", "group": "T1D", "figure_data": ""}, {"id": "T1D03", "correct_letter": "C", "refs": "[97.211(b), 97.215(b), 97.113(a)(4)]", "question": "When is it permissible to transmit messages encoded to obscure their meaning?", "answers": {"A": "Only when using a remote station during a contest", "B": "Only when transmitting certain approved digital codes", "C": "Only when transmitting control commands to space stations or model craft", "D": "Never"}, "figure": "", "subelement": "T1", "group": "T1D", "figure_data": ""}, {"id": "T1D04", "correct_letter": "A", "refs": "[97.113(a)(4), 97.113(c)]", "question": "Under what conditions is an amateur station authorized to transmit music using a phone emission?", "answers": {"A": "When incidental to an authorized retransmission of manned spacecraft communications", "B": "When the music produces no spurious emissions", "C": "When transmissions are limited to less than three minutes per hour", "D": "When the music is transmitted above 1280 MHz"}, "figure": "", "subelement": "T1", "group": "T1D", "figure_data": ""}, {"id": "T1D05", "correct_letter": "D", "refs": "[97.113(a)(3)(ii)]", "question": "When may amateur radio operators use their stations to notify other amateurs of the availability of equipment for sale or trade?", "answers": {"A": "Never", "B": "When the equipment is not the personal property of either the station licensee, or the control operator, or their close relatives", "C": "When no profit is made on the sale", "D": "When selling amateur radio equipment and not on a regular basis"}, "figure": "", "subelement": "T1", "group": "T1D", "figure_data": ""}, {"id": "T1D06", "correct_letter": "B", "refs": "[97.113(a)(4)]", "question": "What, if any, are the restrictions concerning transmission of language that may be considered indecent or obscene?", "answers": {"A": "The FCC maintains a list of words that are not permitted to be used on amateur frequencies", "B": "Any such language is prohibited", "C": "The International Telecommunications Union (ITU) maintains a list of words that are not permitted to be used on amateur frequencies", "D": "There is no such prohibition"}, "figure": "", "subelement": "T1", "group": "T1D", "figure_data": ""}, {"id": "T1D07", "correct_letter": "A", "refs": "[97.113(d), 97.201(e)]", "question": "Which of the following is an example of an auxiliary station?", "answers": {"A": "A station sending one-way transmissions between a remote repeater receiver and the main repeater transmitter", "B": "A backup radio for emergency use in case the main station radio fails", "C": "A station used in the Military Auxiliary Radio System for linking government and amateur stations in a digital network", "D": "A second station utilized in multi-operator contest stations"}, "figure": "", "subelement": "T1", "group": "T1D", "figure_data": ""}, {"id": "T1D08", "correct_letter": "B", "refs": "[97.113(a)(3)(iii)]", "question": "In which of the following circumstances may the control operator of an amateur station receive compensation for operating that station?", "answers": {"A": "When the communication is related to the sale of amateur equipment by the control operator's employer", "B": "When the communication is a part of classroom instruction at an educational institution", "C": "When the communication is made to obtain emergency information for a local broadcast station", "D": "All these choices are correct"}, "figure": "", "subelement": "T1", "group": "T1D", "figure_data": ""}, {"id": "T1D09", "correct_letter": "A", "refs": "[97.113(5)(b)]", "question": "When may amateur stations transmit information in support of broadcasting, program production, or news gathering, assuming no other means is available?", "answers": {"A": "When such communications are directly related to the immediate safety of human life or protection of property", "B": "When broadcasting communications to or from the space shuttle", "C": "Where non-commercial programming is gathered and supplied exclusively to the National Public Radio network", "D": "Never"}, "figure": "", "subelement": "T1", "group": "T1D", "figure_data": ""}, {"id": "T1D10", "correct_letter": "D", "refs": "[97.3(a)(10)]", "question": "How does the FCC define broadcasting for the Amateur Radio Service?", "answers": {"A": "Two-way transmissions by amateur stations", "B": "Any transmission made by the licensed station", "C": "Transmission of messages directed only to amateur operators", "D": "Transmissions intended for reception by the general public"}, "figure": "", "subelement": "T1", "group": "T1D", "figure_data": ""}, {"id": "T1D11", "correct_letter": "D", "refs": "[97.215]", "question": "When may an amateur station transmit without identifying on the air?", "answers": {"A": "When the transmissions are of a brief nature to make station adjustments", "B": "When the transmissions are unmodulated", "C": "When the transmitted power level is below 0.1 watt", "D": "When transmitting signals to control model craft"}, "figure": "", "subelement": "T1", "group": "T1D", "figure_data": ""}, {"id": "T1D12", "correct_letter": "A", "refs": "[97.119(a)]", "question": "Which of the following is required when making on-the-air test transmissions?", "answers": {"A": "Identify the transmitting station", "B": "Conduct tests only between 10 p.m. and 6 a.m. local time", "C": "Notify the FCC of the transmissions", "D": "All these choices are correct"}, "figure": "", "subelement": "T1", "group": "T1D", "figure_data": ""}, {"id": "T1E01", "correct_letter": "D", "refs": "[97.7(a)]", "question": "When may an amateur station transmit without a control operator?", "answers": {"A": "When using automatic control, such as in the case of a repeater", "B": "When the station licensee is away and another licensed amateur is using the station ", "refs": "[97.301]", "question": "When, other than during an emergency, may a Technician class licensee be the control operator of a station operating in an Amateur Extra Class band segment?", "answers": {"A": "At no time", "B": "When designated as the control operator by an Amateur Extra Class licensee", "C": "As part of a multi-operator contest team", "D": "When using a club station whose trustee holds an Amateur Extra Class license"}, "figure": "", "subelement": "T1", "group": "T1E", "figure_data": ""}, {"id": "T1E07", "correct_letter": "D", "refs": "[97.103(a)]", "question": "When the control operator is not the station licensee, who is responsible for the proper operation of the station?", "answers": {"A": "All licensed amateurs who are present at the operation", "B": "Only the station licensee", "C": "Only the control operator", "D": "The control operator and the station licensee"}, "figure": "", "subelement": "T1", "group": "T1E", "figure_data": ""}, {"id": "T1E08", "correct_letter": "A", "refs": "[97.3(a)(6), 97.205(d)]", "question": "Which of the following is an example of automatic control?", "answers": {"A": "Repeater operation", "B": "Controlling a station over the internet", "C": "Using a computer or other device to send CW automatically", "D": "Using a computer or other device to identify automatically"}, "figure": "", "subelement": "T1", "group": "T1E", "figure_data": ""}, {"id": "T1E09", "correct_letter": "D", "refs": "[97.109(c)]", "question": "Which amateur stations may be remotely controlled?", "answers": {"A": "Only repeater stations", "B": "Only automatically controlled stations", "C": "Only digital stations", "D": "Any station"}, "figure": "", "subelement": "T1", "group": "T1E", "figure_data": ""}, {"id": "T1E10", "correct_letter": "B", "refs": "[97.3(a)(39)]", "question": "Which of the following is an example of remote control as defined in Part 97?", "answers": {"A": "A software defined radio (SDR)", "B": "Operating the station over the int ty agreement", "C": "The licensed control operator must do the station identification", "D": "All these choices are correct"}, "figure": "", "subelement": "T1", "group": "T1F", "figure_data": ""}, {"id": "T1F08", "correct_letter": "A", "refs": "[97.3(a)(47)]", "question": "What is the definition of third-party communications?", "answers": {"A": "A message from a control operator to another amateur station control operator on behalf of another person", "B": "Amateur radio communications where three stations are in communications with one another", "C": "Operation when the transmitting equipment is licensed to a person other than the control operator", "D": "Temporary authorization for an unlicensed person to transmit on the amateur bands for technical experiments"}, "figure": "", "subelement": "T1", "group": "T1F", "figure_data": ""}, {"id": "T1F09", "correct_letter": "C", "refs": "[97.3(a)(40)]", "question": "What type of amateur station simultaneously retransmits the signal of another amateur station on a different channel or channels?", "answers": {"A": "Beacon station", "B": "Remote control station", "C": "Repeater station", "D": "Message forwarding station"}, "figure": "", "subelement": "T1", "group": "T1F", "figure_data": ""}, {"id": "T1F10", "correct_letter": "A", "refs": "[97.205(g)]", "question": "Who is accountable if a repeater inadvertently retransmits communications that violate the FCC rules?", "answers": {"A": "The control operator of the originating station", "B": "The control operator of the repeater", "C": "The owner of the repeater", "D": "Both the originating station and the repeater owner"}, "figure": "", "subelement": "T1", "group": "T1F", "figure_data": ""}, {"id": "T1F11", "correct_letter": "B", "refs": "[97.5(b)(2)]", "question": "Which of the following is a requirement for the issuance of a club station license grant?", "answers": {"A": "The trustee must have an Amateur Extra Class operator license grant", "B": "The club must have at least four members", "C": "The club must be registered with the American Radio Relay League (ARRL)", "D": "All these choices are correct"}, "figure": "", "subelement": "T1", "group": "T1F", "figure_data": ""}, {"id": "T2A01", "correct_letter": "B", "refs": "", "question": "What is a common repeater frequency offset in the 2-meter band?", "answers": {"A": "Plus or minus 5 MHz", "B": "Plus or minus 600 kHz", "C": "Plus or minus 500 kHz", "D": "Plus or minus 1 MHz"}, "figure": "", "subelement": "T2", "group": "T2A", "figure_data": ""}, {"id": "T2A02", "correct_letter": "A", "refs": "", "question": "What is the national calling frequency for FM simplex operations in the 2-meter band?", "answers": {"A": "146.520 MHz", "B": "145.000 MHz", "C": "432.100 MHz", "D": "446.000 MHz"}, "figure": "", "subelement": "T2", "group": "T2A", "figure_data": ""}, {"id": "T2A03", "correct_letter": "A", "refs": "", "question": "What is a common repeater frequency offset in the 70-centimeter band?", "answers": {"A": "Plus or minus 5 MHz", "B": "Plus or minus 600 kHz", "C": "Plus or minus 500 kHz", "D": "Plus or minus 1 MHz"}, "figure": "", "subelement": "T2", "group": "T2A", "figure_data": ""}, {"id": "T2A04", "correct_letter": "B", "refs": "", "question": "What is an appropriate way to call another station on a repeater if you know the other station's call sign?", "answers": {"A": "Say \"break, break,\" then the other station’s call sign, followed by your call sign", "B": "Say the station's call sign, then identify with your call sign", "C": "Say \"CQ\" three times, then the other station's call sign, followed by your call sign", "D": "Wait for the station to call CQ, then answer with your call sign"}, "figure": "", "subelement": "T2", "group": "T2A", "figure_data": ""}, {"id": "T2A05", "correct_letter": "C", "refs": "", "question": "How should you respond to a station calling CQ?", "answers": {"A": "Transmit \"CQ\" followed by the other station’s call sign", "B": "Transmit your call sign followed by the other station’s call sign", "C": "Transmit the other station’s call sign followed by your call sign", "D": "Transmit a signal report followed by your call sign"}, "figure": "", "subelement": "T2", "group": "T2A", "figure_data": ""}, {"id": "T2A06", "correct_letter": "D", "refs": "", "question": "What is an effective way to seek a call from any phone station when not using a repeater?", "answers": {"A": "Sign your call sign once, followed by the words “listening for a call;” if there is no answer, change the frequency and repeat", "B": "Say “QTC,” followed by “this is” and your call sign; if there is no answer, change the frequency and repeat", "C": "Transmit an unmodulated carrier for approximately 10 seconds, followed by “this is” and your call sign, and pause to listen; repeat as necessary", "D": "Repeat “CQ” a few times, followed by “this is,” and your call sign, then pause to listen; repeat as necessary"}, "figure": "", "subelement": "T2", "group": "T2A", "figure_data": ""}, {"id": "T2A07", "correct_letter": "A", "refs": "", "question": "What does the term \"repeater offset\" mean?", "answers": {"A": "The difference between a repeater’s transmit and receive frequencies", "B": "The repeater has a time delay to prevent interference", "C": "The approximately half-second delay to allow for the “squelch tail” to be removed", "D": "The fee charged by the repeater owner or club to provide for maintenance"}, "figure": "", "subelement": "T2", "group": "T2A", "figure_data": ""}, {"id": "T2A08", "correct_letter": "D", "refs": "", "question": "What is the meaning of the procedural signal “CQ”?", "answers": {"A": "A shortened form of the term “Contest QSO”", "B": "“Communication Quality,” used to indicate transmitted audio clarity", "C": "Only the called station should transmit", "D": "Calling any station"}, "figure": "", "subelement": "T2", "group": "T2A", "figure_data": ""}, {"id": "T2A09", "correct_letter": "B", "refs": "", "question": "Which of the following is bes a linked repeater network?", "answers": {"A": "A network of repeaters in which signals received by one repeater are transmitted by all the repeaters in the network", "B": "A single repeater with more than one receiver", "C": "Multiple repeaters with the same control operator", "D": "A system of repeaters linked by APRS"}, "figure": "", "subelement": "T2", "group": "T2B", "figure_data": ""}, {"id": "T2B04", "correct_letter": "D", "refs": "", "question": "Which of the following could be the reason you are unable to access a repeater whose output you can hear?", "answers": {"A": "Improper transceiver offset", "B": "You are using the wrong CTCSS tone", "C": "You are using the wrong DCS code", "D": "All these choices are correct"}, "figure": "", "subelement": "T2", "group": "T2B", "figure_data": ""}, {"id": "T2B05", "correct_letter": "C", "refs": "", "question": "Which of the following would cause your FM transmission audio to drop out on voice peaks?", "answers": {"A": "Your repeater offset is inverted", "B": "Your FM deviation is too low", "C": "You are talking too loudly", "D": "Your transmit power is too high"}, "figure": "", "subelement": "T2", "group": "T2B", "figure_data": ""}, {"id": "T2B06", "correct_letter": "A", "refs": "", "question": "What type of signaling to a repeater uses two simultaneous audio tones?", "answers": {"A": "DTMF", "B": "CTCSS", "C": "GMRS", "D": "D-STAR"}, "figure": "", "subelement": "T2", "group": "T2B", "figure_data": ""}, {"id": "T2B07", "correct_letter": "C", "refs": "", "question": "How can you join a digital repeater’s “talkgroup”?", "answers": {"A": "Register with the local Frequency Coordinator", "B": "Register with the digital repeater control operator", "C": "Program your radio with the group’s ID or code", "D": "Program your radio with the DTMF tone used by the talkgroup"}, "figure": "", "subelement": "T2", "group": "T2B", "figure_data": ""}, {"id": "T2B08", "correct_letter": "A", "refs": "", "question": "Which of the followi output from a solid-state transceiver?", "answers": {"A": "Poor amplifier noise figure", "B": "Poor amplifier linearity", "C": "Low SWR", "D": "High SWR"}, "figure": "", "subelement": "T7", "group": "T7B", "figure_data": ""}, {"id": "T7B05", "correct_letter": "A", "refs": "", "question": "Which of the following might reduce interference by an amateur station to a non-amateur over-the-air radio receiver?", "answers": {"A": "Block the amateur signal with a filter at the antenna input of the affected receiver", "B": "Block the interfering signal with a filter on the amateur transmitter", "C": "Switch the transmitter from FM to SSB", "D": "Switch the transmitter to a narrow-band mode"}, "figure": "", "subelement": "T7", "group": "T7B", "figure_data": ""}, {"id": "T7B06", "correct_letter": "A", "refs": "", "question": "Which of the following actions should you take if a neighbor tells you that your station’s transmissions are interfering with their radio or TV reception?", "answers": {"A": "Make sure that your station is functioning properly and that it does not cause interference to your own radio or television when it is tuned to the same channel", "B": "Immediately turn off your transmitter and contact the nearest FCC office for assistance", "C": "Install a harmonic doubler on the output of your transmitter and tune it until the interference is eliminated", "D": "All these choices are correct"}, "figure": "", "subelement": "T7", "group": "T7B", "figure_data": ""}, {"id": "T7B07", "correct_letter": "D", "refs": "", "question": "Which of the following can reduce interference to a 2-meter band transceiver from a nearby commercial FM station?", "answers": {"A": "Installing an RF preamplifier", "B": "Using double-shielded coaxial cable", "C": "Installing bypass capacitors on the microphone cable", "D": "Installing a band-reject filter"}, "figure": "", "subelement": "T7", "group": "T7B", "figure_data": ""}, {"id": "T7B08", "correct_letter": "D", "refs": "", "question": "What should you do if something in a neighbor’s home is causing harmful interference to your amateur station?", "answers": {"A": "Work with your neighbor to identify the offending device", "B": "Politely inform your neighbor that FCC rules prohibit the use of devices that cause interference", "C": "Make sure your station meets the standards of good amateur practice", "D": "All these choices are correct"}, "figure": "", "subelement": "T7", "group": "T7B", "figure_data": ""}, {"id": "T7B09", "correct_letter": "D", "refs": "", "question": "What should be the first step to resolve non-fiber optic cable TV interference caused by your amateur radio transmission?", "answers": {"A": "Add a low-pass filter to the TV antenna input", "B": "Add a high-pass filter to the TV antenna input", "C": "Add a preamplifier to the TV antenna input", "D": "Be sure all TV feed line coaxial connectors are installed properly"}, "figure": "", "subelement": "T7", "group": "T7B", "figure_data": ""}, {"id": "T7B10", "correct_letter": "D", "refs": "", "question": "What might be a problem if you receive a report that your audio signal through an FM repeater is distorted or unintelligible?", "answers": {"A": "Your transmitter is slightly off frequency", "B": "You are speaking too loudly or too close to the microphone", "C": "You are in a bad location", "D": "All these choices are correct"}, "figure": "", "subelement": "T7", "group": "T7B", "figure_data": ""}, {"id": "T7B11", "correct_letter": "C", "refs": "", "question": "Which of the following can eliminate distorted voice transmissions?", "answers": {"A": "Adding extra feedline to the antenna to lower SWR", "B": "Turning the radio on and off to reset the computer-controlled circuitry", "C": "Adding a clip-on ferrite “choke” to the microphone cable to prevent the transmitted signal from feeding back into the transmitter", "D": "Turning the squelch control fully clockwise to prevent the transmitted signal from triggering the squelch circuit"}, "figure" ": "T7", "group": "T7C", "figure_data": ""}, {"id": "T7C06", "correct_letter": "D", "refs": "", "question": "What does an SWR reading of 4:1 indicate?", "answers": {"A": "Loss of -4 dB", "B": "Good impedance match", "C": "Gain of +4 dB", "D": "Impedance mismatch"}, "figure": "", "subelement": "T7", "group": "T7C", "figure_data": ""}, {"id": "T7C07", "correct_letter": "C", "refs": "", "question": "What happens to power lost in a feed line?", "answers": {"A": "It increases the SWR", "B": "It is radiated as harmonics", "C": "It is converted into heat", "D": "It distorts the signal"}, "figure": "", "subelement": "T7", "group": "T7C", "figure_data": ""}, {"id": "T7C08", "correct_letter": "D", "refs": "", "question": "Which instrument can be used to determine SWR?", "answers": {"A": "Voltmeter", "B": "Ohmmeter", "C": "Iambic pentameter", "D": "Directional wattmeter"}, "figure": "", "subelement": "T7", "group": "T7C", "figure_data": ""}, {"id": "T7C09", "correct_letter": "A", "refs": "", "question": "Which of the following causes failure of coaxial cables?", "answers": {"A": "Moisture contamination", "B": "Solder flux contamination", "C": "Rapid fluctuation in transmitter output power", "D": "Operation at 100% duty cycle for an extended period"}, "figure": "", "subelement": "T7", "group": "T7C", "figure_data": ""}, {"id": "T7C10", "correct_letter": "D", "refs": "", "question": "Why should the outer jacket of coaxial cable be resistant to ultraviolet light?", "answers": {"A": "Ultraviolet light can increase the resistance of the conductors", "B": "Ultraviolet light can increase losses in the cable’s jacket", "C": "Ultraviolet and RF signals can mix, causing interference", "D": "Ultraviolet light can damage the jacket and allow water to enter the cable"}, "figure": "", "subelement": "T7", "group": "T7C", "figure_data": ""}, {"id": "T7C11", "correct_letter": "C", "refs": "", "question": "What is an advantage of foam-dielectric versus solid-dielectric coaxial cable?", "answers at is the purpose of a safety wire through a turnbuckle used to tension guy lines?", "answers": {"A": "Secure the guy line if the turnbuckle breaks", "B": "Prevent loosening of the turnbuckle from vibration", "C": "Provide a ground path for lightning strikes", "D": "Provide an ability to measure for proper tensioning"}, "figure": "", "subelement": "T0", "group": "T0B", "figure_data": ""}, {"id": "T0B06", "correct_letter": "D", "refs": "", "question": "What is the minimum safe distance from a power line to allow when installing an antenna?", "answers": {"A": "Add the height of the antenna to the height of the power line and multiply by a factor of 1.5", "B": "The height of the power line above ground", "C": "1/2 wavelength at the operating frequency", "D": "Enough so that if the antenna falls, no part of it can come within 10 feet of the power wires"}, "figure": "", "subelement": "T0", "group": "T0B", "figure_data": ""}, {"id": "T0B07", "correct_letter": "C", "refs": "", "question": "Which of the following is an important safety rule to remember when using a crank-up tower?", "answers": {"A": "This type of tower must never be painted", "B": "This type of tower must never be grounded", "C": "This type of tower must not be climbed unless it is retracted, or mechanical safety locking devices have been installed", "D": "All these choices are correct"}, "figure": "", "subelement": "T0", "group": "T0B", "figure_data": ""}, {"id": "T0B08", "correct_letter": "D", "refs": "", "question": "Which is a proper grounding method for a tower?", "answers": {"A": "A single four-foot ground rod, driven into the ground no more than 12 inches from the base", "B": "A ferrite-core RF choke connected between the tower and ground", "C": "A connection between the tower base and a cold-water pipe", "D": "Separate eight-foot ground rods for each tower leg, bonded to the tower and each other"}, "figure": "", "subelement": "T0", "group": "T0B", "figure_data": ""}, {"id": "T0B09", "correct_letter" ercent?", "answers": {"A": "It increases by a factor of 3", "B": "It decreases by 50 percent", "C": "It increases by a factor of 2", "D": "There is no adjustment allowed for lower duty cycle"}, "figure": "", "subelement": "T0", "group": "T0C", "figure_data": ""}, {"id": "T0C04", "correct_letter": "D", "refs": "", "question": "What factors affect the RF exposure of people near an amateur station antenna?", "answers": {"A": "Frequency and power level of the RF field", "B": "Distance from the antenna to a person", "C": "Radiation pattern of the antenna", "D": "All these choices are correct"}, "figure": "", "subelement": "T0", "group": "T0C", "figure_data": ""}, {"id": "T0C05", "correct_letter": "D", "refs": "", "question": "Why do exposure limits vary with frequency?", "answers": {"A": "Lower frequency RF fields have more energy than higher frequency fields", "B": "Lower frequency RF fields do not penetrate the human body", "C": "Higher frequency RF fields are transient in nature", "D": "The human body absorbs more RF energy at some frequencies than at others"}, "figure": "", "subelement": "T0", "group": "T0C", "figure_data": ""}, {"id": "T0C06", "correct_letter": "D", "refs": "", "question": "Which of the following is an acceptable method to determine whether your station complies with FCC RF exposure regulations?", "answers": {"A": "By calculation based on FCC OET Bulletin 65", "B": "By calculation based on computer modeling", "C": "By measurement of field strength using calibrated equipment", "D": "All these choices are correct"}, "figure": "", "subelement": "T0", "group": "T0C", "figure_data": ""}, {"id": "T0C07", "correct_letter": "B", "refs": "", "question": "What hazard is created by touching an antenna during a transmission?", "answers": {"A": "Electrocution", "B": "RF burn to skin", "C": "Exposure to ionizing radiation", "D": "All these choices are correct"}, "figure": "", "subelement": "T0", "group": "T0C", "figure_data": ""}, {"id": "T0C08", "correct_letter": "A", "refs": "", "question": "Which of the following actions can reduce exposure to RF radiation?", "answers": {"A": "Relocate antennas", "B": "Relocate the transmitter", "C": "Increase the duty cycle", "D": "All these choices are correct"}, "figure": "", "subelement": "T0", "group": "T0C", "figure_data": ""}, {"id": "T0C09", "correct_letter": "B", "refs": "", "question": "How can you make sure your station stays in compliance with RF safety regulations?", "answers": {"A": "By informing the FCC of any changes made in your station", "B": "By re-evaluating the station whenever an item in the transmitter or antenna system is changed", "C": "By making sure your antennas have low SWR", "D": "By using only Underwriter Laboratories approved transmitting equipment"}, "figure": "", "subelement": "T0", "group": "T0C", "figure_data": ""}, {"id": "T0C10", "correct_letter": "A", "refs": "", "question": "Why is duty cycle one of the factors used to determine safe RF radiation exposure levels?", "answers": {"A": "It affects the average exposure to radiation", "B": "It affects the peak exposure to radiation", "C": "It takes into account the antenna feed line loss", "D": "It takes into account the thermal effects of the final amplifier"}, "figure": "", "subelement": "T0", "group": "T0C", "figure_data": ""}, {"id": "T0C11", "correct_letter": "C", "refs": "", "question": "What is the definition of duty cycle during the averaging time for RF exposure?", "answers": {"A": "The difference between the lowest and highest power output of a transmitter", "B": "The difference between the PEP and the average power output of a transmitter", "C": "The percentage of time that a transmitter is transmitting", "D": "The percentage of time that a transmitter is not transmitting"}, "figure": "", "subelement": "T0", "group": "T0C", "figure_data": ""}, {"id": "T0C12", "correct_letter": "A", "refs": "", "question": "How does RF radiation differ from ionizing radiation (radioactivity)?", "answers": {"A": "RF radiation does not have sufficient energy to cause chemical changes in cells and damage DNA", "B": "RF radiation can only be detected with an RF dosimeter", "C": "RF radiation is limited in range to a few feet", "D": "RF radiation is perfectly safe"}, "figure": "", "subelement": "T0", "group": "T0C", "figure_data": ""}, {"id": "T0C13", "correct_letter": "B", "refs": "", "question": "Who is responsible for ensuring that no person is exposed to RF energy above the FCC exposure limits?", "answers": {"A": "The FCC", "B": "The station licensee", "C": "Anyone who is near an antenna", "D": "The local zoning board"}, "figure": "", "subelement": "T0", "group": "T0C", "figure_data": ""}];
let deck = [...ALL], idx = 0, known = 0, missed = 0;

const $ = id => document.getElementById(id);
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function render() {
  if (!deck.length) {
    $('front').innerHTML='<div class="question">No matching cards.</div>';
    $('back').innerHTML='';
    $('counter').textContent='0 cards';
    return;
  }
  idx = ((idx % deck.length) + deck.length) % deck.length;
  const c = deck[idx];
  const fig = c.figure_data ? `<img class="figure" src="${c.figure_data}" alt="${esc(c.figure)}">` : '';
  $('front').innerHTML = `
    <div class="badge">${esc(c.id)} • ${esc(c.group)}</div>
    <div class="question">${esc(c.question)}</div>
    ${fig}
    ${['A','B','C','D'].map(x => `<div class="choice"><b>${x}.</b> ${esc(c.answers[x])}</div>`).join('')}
    <div class="hint">Tap the card or Reveal to show the answer.</div>`;
  $('back').innerHTML = `
    <div class="badge">${esc(c.id)}</div>
    <div class="answer-title">Correct answer</div>
    <div class="answer">${esc(c.correct_letter)}. ${esc(c.answers[c.correct_letter])}</div>
    ${fig}
    <div class="question" style="font-size:1rem;font-weight:600">${esc(c.question)}</div>
    <div class="ref">${c.refs ? 'FCC reference: ' + esc(c.refs) : 'No rule reference listed for this question.'}</div>
    <div class="hint">Use Knew it / Missed it, then continue.</div>`;
  $('counter').textContent = `${idx+1} / ${deck.length}`;
  $('score').textContent = `Knew ${known} • Missed ${missed}`;
  $('card').classList.remove('flipped');
  $('flip').textContent='Reveal';
}
function flip() {
  $('card').classList.toggle('flipped');
  $('flip').textContent = $('card').classList.contains('flipped') ? 'Question' : 'Reveal';
}
function applyFilter() {
  const f=$('filter').value;
  const q=$('search').value.trim().toLowerCase();
  deck=ALL.filter(c => (f==='ALL' || c.subelement===f) &&
    (!q || c.id.toLowerCase().includes(q) || c.question.toLowerCase().includes(q) ||
     Object.values(c.answers).some(a=>a.toLowerCase().includes(q))));
  idx=0; render();
}
$('card').onclick=flip; $('flip').onclick=flip;
$('prev').onclick=()=>{idx--;render();};
$('next').onclick=()=>{idx++;render();};
$('shuffle').onclick=()=>{for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];} idx=0;render();};
$('reset').onclick=()=>{known=0;missed=0;render();};
$('knew').onclick=()=>{known++;idx++;render();};
$('missed').onclick=()=>{missed++;idx++;render();};
$('filter').onchange=applyFilter; $('search').oninput=applyFilter;
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'){idx++;render();}
  else if(e.key==='ArrowLeft'){idx--;render();}
  else if(e.key===' ' || e.key==='Enter'){e.preventDefault();flip();}
});
render();
</script>
